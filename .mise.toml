[tools]
java = "temurin-17.0.20+101"
node = "26.8.1"
lefthook = "2.1.12"
redis = "8.10.1"

[env]
_.file = ".env"

[tasks.setup]
description = "최초 프로젝트 환경 세팅"
run = [
  "mise install",
  "npm install",
  "lefthook install",
  "cp -n .env.example .env",
]

[tasks.lint]
description = "포맷/린트 검사 (spotless + checkstyle)"
run = "./gradlew spotlessCheck checkstyleMain"

[tasks.test]
description = "테스트 실행"
run = "./gradlew test"

[tasks.monitoring]
description = "관측 스택 실행 (Prometheus/Grafana/Loki/Alloy)"
run = "docker compose up -d prometheus grafana loki alloy"
